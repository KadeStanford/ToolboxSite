<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Generator — Create Professional Invoices Online | ToolNook</title>
  <meta name="description" content="Create professional invoices online for free. Add your business info, client details, and line items. Calculate totals automatically. Print or save as PDF." />
  <meta name="keywords" content="invoice generator, free invoice maker, online invoice creator, PDF invoice, professional invoice template, freelance invoice" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://toolnook.net/tools/invoice-generator.html" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>" />
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Can I save the invoice as a PDF?","acceptedAnswer":{"@type":"Answer","text":"Yes. Click the 'Print / Save PDF' button and use your browser's built-in 'Save as PDF' option in the print dialog to save the invoice as a PDF file."}},{"@type":"Question","name":"Is my invoice data saved anywhere?","acceptedAnswer":{"@type":"Answer","text":"No. All invoice data stays in your browser. Nothing is sent to any server. For reusable templates, use your browser's form autofill or copy the generated invoice before closing."}},{"@type":"Question","name":"What should an invoice include?","acceptedAnswer":{"@type":"Answer","text":"A professional invoice should include: invoice number, issue date, due date, your business name and contact info, client name and address, itemized list of services/goods, subtotal, tax, and total amount due."}}]}
  </script>
  <style>
    @media print {
      .no-print, .tool-header, .ad-banner, .sidebar, .related-tools, .seo-content, #site-header, #site-footer, .breadcrumb { display:none !important; }
      .page-with-sidebar { display:block; }
      .main-content { margin:0; padding:0; max-width:100%; }
      .invoice-preview { box-shadow:none; border:none; }
    }
    .invoice-form { display:grid; gap:12px; }
    .form-2col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media(max-width:580px) { .form-2col { grid-template-columns:1fr; } }
    .invoice-preview { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:32px; margin-top:16px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
    .inv-header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
    .inv-title { font-size:2rem; font-weight:900; color:var(--primary); letter-spacing:.05em; }
    .inv-meta table { font-size:.82rem; }
    .inv-meta td { padding:2px 6px; }
    .inv-meta td:first-child { font-weight:700; color:var(--text-muted); }
    .inv-from, .inv-to { font-size:.88rem; line-height:1.6; }
    .inv-from strong, .inv-to strong { font-size:1rem; font-weight:700; }
    .inv-bill-row { display:grid; grid-template-columns:1fr 1fr; gap:32px; margin:20px 0; }
    @media(max-width:500px) { .inv-bill-row { grid-template-columns:1fr; } }
    .items-table { width:100%; border-collapse:collapse; font-size:.85rem; margin-top:16px; }
    .items-table th { background:var(--primary); color:#fff; padding:8px 10px; text-align:left; }
    .items-table td { padding:8px 10px; border-bottom:1px solid var(--border); }
    .items-table tr:last-child td { border-bottom:none; }
    .totals-block { display:flex; justify-content:flex-end; margin-top:12px; }
    .totals-table { font-size:.88rem; }
    .totals-table td { padding:4px 8px; }
    .totals-table td:last-child { text-align:right; font-weight:600; min-width:100px; }
    .totals-table tr.grand td { border-top:2px solid var(--primary); font-size:1rem; font-weight:800; color:var(--primary); }
    .notes-block { margin-top:16px; font-size:.82rem; border-top:1px solid var(--border); padding-top:12px; color:var(--text-muted); }
    .add-item-btn { font-size:.8rem; }
  </style>
</head>
<body>
<div id="site-header"></div>
<div class="page-with-sidebar">
  <main class="main-content">
    <div class="ad-banner ad-banner-top no-print"></div>
    <div class="tool-header">
      <div class="breadcrumb"><a href="/">Home</a> › <a href="/#content-tools">Content & SEO</a> › Invoice Generator</div>
      <h1>Invoice Generator</h1>
      <p>Fill in your details and line items, then print or save as PDF.</p>
    </div>

    <div class="tool-container no-print">
      <div class="invoice-form">
        <div class="form-2col">
          <div>
            <p class="input-label" style="font-weight:700;margin-bottom:6px;">Your Business</p>
            <input type="text" id="from-name" placeholder="Your Name / Business Name" oninput="render()" />
            <textarea id="from-address" placeholder="Address&#10;City, State ZIP&#10;Email · Phone" style="height:72px;margin-top:6px;" oninput="render()"></textarea>
          </div>
          <div>
            <p class="input-label" style="font-weight:700;margin-bottom:6px;">Bill To</p>
            <input type="text" id="to-name" placeholder="Client Name / Company" oninput="render()" />
            <textarea id="to-address" placeholder="Address&#10;City, State ZIP&#10;Email" style="height:72px;margin-top:6px;" oninput="render()"></textarea>
          </div>
        </div>
        <div class="form-2col">
          <div>
            <label class="input-label">Invoice #</label>
            <input type="text" id="inv-num" value="INV-001" oninput="render()" />
          </div>
          <div>
            <label class="input-label">Currency</label>
            <select id="inv-currency" onchange="render()">
              <option value="$">USD ($)</option>
              <option value="€">EUR (€)</option>
              <option value="£">GBP (£)</option>
              <option value="¥">JPY (¥)</option>
              <option value="CA$">CAD (CA$)</option>
              <option value="A$">AUD (A$)</option>
            </select>
          </div>
          <div>
            <label class="input-label">Issue Date</label>
            <input type="date" id="inv-date" oninput="render()" />
          </div>
          <div>
            <label class="input-label">Due Date</label>
            <input type="date" id="inv-due" oninput="render()" />
          </div>
        </div>
      </div>

      <p style="font-weight:700;font-size:.88rem;margin:14px 0 6px;">Line Items</p>
      <div id="items-form"></div>
      <button class="btn btn-secondary add-item-btn" onclick="addItem()" style="margin-top:8px;">+ Add Line Item</button>

      <div class="form-2col" style="margin-top:12px;">
        <div>
          <label class="input-label">Tax (%)</label>
          <input type="number" id="inv-tax" value="0" min="0" max="100" step="0.1" oninput="render()" />
        </div>
        <div>
          <label class="input-label">Discount (%)</label>
          <input type="number" id="inv-discount" value="0" min="0" max="100" step="0.1" oninput="render()" />
        </div>
      </div>
      <div style="margin-top:10px;">
        <label class="input-label">Notes / Payment Terms</label>
        <textarea id="inv-notes" placeholder="Payment due within 30 days. Thank you for your business!" style="height:56px;" oninput="render()"></textarea>
      </div>
      <button class="btn btn-primary" style="margin-top:14px;" onclick="window.print()">🖨️ Print / Save PDF</button>
    </div>

    <!-- INVOICE PREVIEW (printed) -->
    <div class="invoice-preview" id="inv-preview"></div>

    <div class="ad-banner ad-banner-bottom no-print"></div>
  </main>
  <aside class="sidebar no-print">
    <div class="ad-banner ad-sidebar"></div>
    <div class="sidebar-widget"><h3>Other Tools</h3><div id="sidebar-tools"></div></div>
  </aside>
</div>
<div id="site-footer" class="no-print"></div>
<div class="toast" id="toast"></div>
<script src="/js/utils.js"></script>
<script src="/js/firebase-config.js"></script>
<script src="/js/analytics.js"></script>
<script src="/js/components.js"></script>
<script>
let items = [
  { desc:'Web Design Services', qty:1, rate:500 },
  { desc:'Hosting Setup',       qty:1, rate:150 },
];

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('sidebar-tools').innerHTML = renderSidebarTools('invoice-generator');
  // Set default dates
  const today = new Date();
  const due   = new Date(today); due.setDate(due.getDate()+30);
  document.getElementById('inv-date').value = today.toISOString().slice(0,10);
  document.getElementById('inv-due').value  = due.toISOString().slice(0,10);
  renderItemsForm();
  render();
});

function addItem() { items.push({ desc:'', qty:1, rate:0 }); renderItemsForm(); render(); }
function removeItem(i) { items.splice(i,1); renderItemsForm(); render(); }

function renderItemsForm() {
  document.getElementById('items-form').innerHTML = items.map((it,i) => `
    <div style="display:grid;grid-template-columns:1fr 70px 100px 28px;gap:6px;margin-bottom:6px;align-items:center;">
      <input type="text" value="${esc(it.desc)}" placeholder="Description" oninput="items[${i}].desc=this.value;render()" />
      <input type="number" value="${it.qty}" min="0" step="any" placeholder="Qty" oninput="items[${i}].qty=parseFloat(this.value)||0;render()" />
      <input type="number" value="${it.rate}" min="0" step="any" placeholder="Rate" oninput="items[${i}].rate=parseFloat(this.value)||0;render()" />
      <button onclick="removeItem(${i})" style="background:#fee2e2;border:1px solid #fca5a5;border-radius:4px;cursor:pointer;font-size:.8rem;">✕</button>
    </div>`).join('');
}

function esc(s) { return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function fmt(n, sym) { return sym + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }

function render() {
  const sym      = document.getElementById('inv-currency').value;
  const fromName = document.getElementById('from-name').value;
  const fromAddr = document.getElementById('from-address').value.replace(/\n/g,'<br>');
  const toName   = document.getElementById('to-name').value;
  const toAddr   = document.getElementById('to-address').value.replace(/\n/g,'<br>');
  const invNum   = document.getElementById('inv-num').value;
  const invDate  = document.getElementById('inv-date').value;
  const invDue   = document.getElementById('inv-due').value;
  const taxPct   = parseFloat(document.getElementById('inv-tax').value)||0;
  const discPct  = parseFloat(document.getElementById('inv-discount').value)||0;
  const notes    = document.getElementById('inv-notes').value.replace(/\n/g,'<br>');

  const subtotal   = items.reduce((s,it) => s + it.qty*it.rate, 0);
  const discAmt    = subtotal * discPct/100;
  const taxAmt     = (subtotal - discAmt) * taxPct/100;
  const total      = subtotal - discAmt + taxAmt;

  const rowsHTML = items.map(it => `
    <tr>
      <td>${esc(it.desc)}</td>
      <td style="text-align:center">${it.qty}</td>
      <td style="text-align:right">${fmt(it.rate,sym)}</td>
      <td style="text-align:right">${fmt(it.qty*it.rate,sym)}</td>
    </tr>`).join('');

  document.getElementById('inv-preview').innerHTML = `
    <div class="inv-header">
      <div class="inv-title">INVOICE</div>
      <div class="inv-meta"><table>
        <tr><td>Invoice #</td><td>${esc(invNum)}</td></tr>
        <tr><td>Date</td><td>${invDate||'—'}</td></tr>
        <tr><td>Due</td><td>${invDue||'—'}</td></tr>
      </table></div>
    </div>
    <div class="inv-bill-row">
      <div class="inv-from"><strong>${esc(fromName)||'Your Business'}</strong><br>${fromAddr||'Your Address'}</div>
      <div class="inv-to"><strong>Bill To</strong><br><strong>${esc(toName)||'Client Name'}</strong><br>${toAddr||'Client Address'}</div>
    </div>
    <table class="items-table">
      <thead><tr><th>Description</th><th style="text-align:center">Qty</th><th style="text-align:right">Rate</th><th style="text-align:right">Amount</th></tr></thead>
      <tbody>${rowsHTML}</tbody>
    </table>
    <div class="totals-block"><table class="totals-table">
      <tr><td>Subtotal</td><td>${fmt(subtotal,sym)}</td></tr>
      ${discPct ? `<tr><td>Discount (${discPct}%)</td><td>-${fmt(discAmt,sym)}</td></tr>` : ''}
      ${taxPct  ? `<tr><td>Tax (${taxPct}%)</td><td>${fmt(taxAmt,sym)}</td></tr>` : ''}
      <tr class="grand"><td>Total Due</td><td>${fmt(total,sym)}</td></tr>
    </table></div>
    ${notes ? `<div class="notes-block"><strong>Notes:</strong><br>${notes}</div>` : ''}`;
}
</script>
</body>
</html>
